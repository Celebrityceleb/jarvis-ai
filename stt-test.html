<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS Whisper Test</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080b12;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 85%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            letter-spacing: 5px;
        }

        #status {
            margin: 25px 0;
            color: #8fa3bd;
        }

        #result {
            min-height: 80px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #263244;
            border-radius: 16px;
        }

        button {
            padding: 16px 25px;
            border: none;
            border-radius: 30px;
            background: #1b2230;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>JARVIS</h1>

    <div id="status">
        LOADING WHISPER...
    </div>

    <div id="result">
        Whisper is loading...
    </div>

    <button id="startButton" disabled>
        🎙️ START LISTENING
    </button>

</div>

<script type="module">

import {
    pipeline
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


const button =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const result =
    document.getElementById("result");


let transcriber = null;


// ==========================================
// LOAD WHISPER
// ==========================================

async function loadWhisper() {

    try {

        status.textContent =
            "LOADING WHISPER...";

        result.textContent =
            "First load may take some time.";

        transcriber = await pipeline(
            "automatic-speech-recognition",
            "onnx-community/whisper-tiny.en",
            {
                device: "webgpu"
            }
        );

        status.textContent =
            "WHISPER READY";

        result.textContent =
            "Speech recognition is ready.";

        button.disabled = false;

        console.log(
            "WHISPER READY"
        );

    } catch (error) {

        console.error(
            "WHISPER ERROR:",
            error
        );

        status.textContent =
            "WEBGPU FAILED";

        result.textContent =
            "Your browser/device could not start Whisper with WebGPU.";

    }
}


// ==========================================
// RECORD MICROPHONE
// ==========================================

async function recordAudio() {

    const stream =
        await navigator.mediaDevices
            .getUserMedia({
                audio: true
            });


    const recorder =
        new MediaRecorder(stream);


    const chunks = [];


    recorder.ondataavailable =
        event => {

            chunks.push(
                event.data
            );

        };


    const recordingFinished =
        new Promise(resolve => {

            recorder.onstop =
                () => {

                    const blob =
                        new Blob(
                            chunks,
                            {
                                type:
                                    "audio/webm"
                            }
                        );

                    resolve(blob);

                };

        });


    recorder.start();


    status.textContent =
        "LISTENING...";

    result.textContent =
        "Speak now.";


    // Record for 5 seconds
    await new Promise(resolve =>
        setTimeout(
            resolve,
            5000
        )
    );


    recorder.stop();


    stream
        .getTracks()
        .forEach(track =>
            track.stop()
        );


    return recordingFinished;
}


// ==========================================
// BUTTON
// ==========================================

button.addEventListener(
    "click",
    async () => {

        if (!transcriber) {
            return;
        }


        button.disabled = true;


        try {

            const audio =
                await recordAudio();


            status.textContent =
                "TRANSCRIBING...";

            result.textContent =
                "Whisper is processing your voice.";


            const output =
                await transcriber(
                    URL.createObjectURL(audio)
                );


            console.log(
                "WHISPER RESULT:",
                output
            );


            result.textContent =
                output.text;


            status.textContent =
                "WHISPER READY";


        } catch (error) {

            console.error(
                "RECORDING ERROR:",
                error
            );

            status.textContent =
                "ERROR";

            result.textContent =
                error.message;

        }


        button.disabled = false;

    }
);


// ==========================================
// START WHISPER
// ==========================================

loadWhisper();

</script>

</body>
</html>
