<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="jarvis">

        <div class="header">
            <h1>JARVIS</h1>
            <p>PERSONAL AI ASSISTANT</p>
        </div>

        <div class="orb">
            <div class="orb-core"></div>
        </div>

        <div class="status">
            <span id="status">SYSTEM READY</span>
        </div>

        <div class="conversation">
            <div id="response">
                Hello. I am JARVIS.
            </div>
        </div>

        <button id="talkButton">
            🎙️ TALK TO JARVIS
        </button>

    </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
